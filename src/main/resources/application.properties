# BASE DE DATOS MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/inventario?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

