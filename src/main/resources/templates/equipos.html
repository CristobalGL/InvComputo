<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Inventario de Cómputo</h1>
        <div>
            <!-- Botón NUEVO solo para ADMIN -->
            <a sec:authorize="hasRole('ADMIN')" 
                href="/equipos/nuevo" class="btn btn-success me-2">
                Agregar Equipo
            </a>

            <a href="/dashboard" class="btn btn-outline-primary me-2">Dashboard</a>
            <a href="/login" class="btn btn-outline-danger">Cerrar Sesión</a>
        </div>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Tipo</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Responsable</th>
                <th>Inventario</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${equipos}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.codigo}"></td>
                <td th:text="${e.tipo}"></td>
                <td th:text="${e.marca}"></td>
                <td th:text="${e.modelo}"></td>
                <td th:text="${e.responsable} ?: 'Sin asignar'"></td>
                <td th:text="${e.inventarioId}"></td>

                <!-- Acciones solo para ADMIN -->
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/equipos/editar/{id}(id=${e.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/equipos/eliminar/{id}(id=${e.id})}" 
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Seguro que deseas eliminar este equipo?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
