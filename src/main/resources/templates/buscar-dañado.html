<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generar FO-MI-03</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

    <h2 class="text-center mb-4 text-primary">
        Generar FO-MI-03 - Baja / Reporte de Equipo
    </h2>

    <div class="table-responsive shadow-sm">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Tipo</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Serie</th>
                    <th>Estatus</th>
                    <th>Garantia</th>
                    <th>No. Empleado</th>
                    <th>Responsable</th>
                    <th>Puesto</th>
                    <th>Localidad</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="e : ${equipos}">
                    <td th:text="${e.codigo}"></td>
                    <td th:text="${e.tipo}"></td>
                    <td th:text="${e.marca}"></td>
                    <td th:text="${e.modelo}"></td>
                    <td th:text="${e.serie ?: 'N/A'}"></td>
                    <td th:text="${e.estatus ?: 'N/A'}"></td>
                    <td th:text="${e.garantia ?: 'N/A'}"></td>
                    <td th:text="${e.noEmpleado ?: 'N/A'}"></td>
                    <td th:text="${e.responsable ?: 'Sin asignar'}"></td>
                    <td th:text="${e.puesto ?: 'N/A'}"></td>
                    <td th:text="${e.inventario?.descripcion ?: 'N/A'}"></td>

                    <td>
                        <a th:href="@{/generar/pdf/fo-mi-03(id=${e.id})}"
                           class="btn btn-danger btn-sm">
                            Generar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver al Dashboard</a>
    </div>

</div>
</body>
</html>
