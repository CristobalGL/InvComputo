<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Inventario de Cómputo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-icon { font-size: 3.5rem; margin-bottom: 1rem; }
        .dash-card {
            transition: all 0.3s ease;
        }
        .dash-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15) !important;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-primary">
            <i class="fas fa-desktop me-3"></i>Sistema de Inventario de Cómputo
        </h1>
        <p class="lead text-muted">
            Bienvenido, <strong sec:authentication="name">Usuario</strong>
        </p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        <!-- FO-MI-01 -->
        <div class="col">
            <a href="/generar/fo-mi-01" class="text-decoration-none">
                <div class="card h-100 text-center dash-card border-0 shadow">
                    <div class="card-body p-5">
                        <i class="fas fa-file-alt card-icon text-success"></i>
                        <h4 class="card-title text-success fw-bold">Generar FO-MI-01</h4>
                        <p class="card-text">Formato de Resguardo Individual de Equipo</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- FO-MI-02 -->
        <div class="col">
            <a href="/generar/fo-mi-02" class="text-decoration-none">
                <div class="card h-100 text-center dash-card border-0 shadow">
                    <div class="card-body p-5">
                        <i class="fas fa-file-export card-icon text-danger"></i>
                        <h4 class="card-title text-danger fw-bold">Generar FO-MI-02</h4>
                        <p class="card-text">Formato de Baja de Equipo</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- FO-MI-03 -->
        <div class="col">
            <a href="/generar/fo-mi-03" class="text-decoration-none">
                <div class="card h-100 text-center dash-card border-0 shadow">
                    <div class="card-body p-5">
                        <i class="fas fa-file-signature card-icon text-warning"></i>
                        <h4 class="card-title text-warning fw-bold">Generar FO-MI-03</h4>
                        <p class="card-text">Formato de Entrega-Recepción de Equipo</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Ver Inventario -->
        <div class="col">
            <a href="/" class="text-decoration-none">
                <div class="card h-100 text-center dash-card border-0 shadow">
                    <div class="card-body p-5">
                        <i class="fas fa-th-list card-icon text-primary"></i>
                        <h4 class="card-title text-primary fw-bold">Ver Inventario</h4>
                        <p class="card-text">Consultar todos los equipos registrados</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="/logout" class="btn btn-outline-secondary btn-lg">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </a>
    </div>
</div>

</body>
</html>
