<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generar FO-MI-01</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4 text-primary">Generar FO-MI-01 - Resguardo de Equipo</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="e : ${equipos}" class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${e.marca + ' ' + e.modelo}"></h5>
                    <p class="card-text">
                        <strong>Código:</strong> <span th:text="${e.codigo}"></span><br>
                        <strong>Tipo:</strong> <span th:text="${e.tipo}"></span><br>
                        <strong>Responsable:</strong> <span th:text="${e.responsable} ?: 'Sin asignar'}"></span>
                    </p>
                    <a th:href="@{/generar/pdf/resguardo(id=${e.id})}" 
                       class="btn btn-success">
                        Descargar FO-MI-01
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver al Dashboard</a>
    </div>
</div>
</body>
</html>
