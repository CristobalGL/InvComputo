<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-container { max-width: 700px; }
        .btn-volver { background-color: #6c757d; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="form-container mx-auto bg-white rounded shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary mb-0">
                <i class="fas fa-laptop-medical me-2"></i>
                <span th:text="${equipo.id != null} ? 'Editar Equipo' : 'Nuevo Equipo'">Nuevo Equipo</span>
            </h2>
            <a href="/equipos" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver al Inventario
            </a>
        </div>

        <!-- Mensajes de éxito/error -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/equipos/guardar}" th:object="${equipo}" method="post" class="needs-validation" novalidate>
            <input type="hidden" th:field="*{id}"/>

            
            <div class="row g-3">
                <!-- CODIGO -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Código <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{codigo}" required maxlength="50"/>
                    <div class="invalid-feedback">El código es obligatorio</div>
                </div>

                <!-- TIPO -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Tipo <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{tipo}" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Impresora">Impresora</option>
                        <option value="Proyector">Proyector</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <div class="invalid-feedback">Selecciona un tipo</div>
                </div>

                <!-- MARCA -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Marca <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{marca}" required>
                        <option value="">-- Seleccionar marca --</option>
                        <option value="HP">HP</option>
                        <option value="Apple">Apple</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="Dell">Dell</option>
                        <option value="Acer">Acer</option>
                        <option value="Asus">Asus</option>
                    </select>
                    <div class="invalid-feedback">La marca es obligatoria</div>
                </div>
                
                <!-- MODELO -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Modelo <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{modelo}" required>
                        <option value="">-- Seleccionar modelo --</option>
                        <option value="Elitebook 840 G9">Elitebook 840 G9</option>
                        <option value="Elitebook 840 G11">Elitebook 840 G11</option>
                        <option value="Elitebook 820 G4">Elitebook 820 G4</option>
                        <option value="Elitebook 8 G1i">Elitebook 8 G1i</option>
                        <option value="ZBook Firefly 14 G7">ZBook Firefly 14 G7</option>
                        <option value="ZBook Firefly 14 G8">ZBook Firefly 14 G8</option>
                        <option value="ZBook Firefly 14 G10">ZBook Firefly 14 G10</option>
                        <option value="ProOne 600 G3">ProOne 600 G3</option>
                        <option value="ProOne 400 G4">ProOne 400 G4</option>
                        <option value="MacBook Air 13 M3">MacBook Air 13 M3</option>
                    </select>
                    <div class="invalid-feedback">El modelo es obligatorio</div>
                </div>
                
                <!-- SERIE -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Serie</label>
                    <input type="text"
                        class="form-control"
                        th:field="*{serie}"
                        maxlength="100"/>
                </div>

                <!-- ESTATUS -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Estatus</label>
                    <select class="form-select" th:field="*{estatus}">
                        <option value="">-- Seleccionar --</option>
                        <option value="Activo">Activo</option>
                        <option value="En reparación">En reparación</option>
                        <option value="Baja">Baja</option>
                        <option value="Resguardo">Resguardo</option>
                    </select>
                </div>

                <!-- GARANTIA -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Garantia</label>
                    <select class="form-select" th:field="*{garantia}">
                        <option value="">-- Seleccionar --</option>
                        <option value="Si">Si</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- NÚMERO DE EMPLEADO -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">No. Empleado</label>
                    <input type="text"
                        class="form-control"
                        th:field="*{noEmpleado}"
                        maxlength="50"/>
                </div>

                <!-- RESOPONSABLE -->
                <div class="col-12">
                    <label class="form-label fw-bold">Responsable</label>
                    <input type="text" class="form-control" th:field="*{responsable}" placeholder="Opcional"/>
                </div>

                <!-- PUESTO -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Puesto</label>
                    <input type="text"
                        class="form-control"
                        th:field="*{puesto}"
                        maxlength="100"/>
                </div>


            <!-- SOLO ADMIN PUEDE VER Y EDITAR -->
            <div class="col-md-6" sec:authorize="hasRole('ADMIN')">
                <label class="form-label fw-bold">
                    Inventario <span class="text-danger">*</span>
                </label>

                <select class="form-select" th:field="*{inventarioId}" required>
                    <option value="">-- Seleccionar inventario --</option>
                    <option th:each="inv : ${inventarios}"
                            th:value="${inv.id}"
                            th:text="${inv.descripcion}">
                    </option>
                </select>

                <div class="invalid-feedback">
                    Selecciona un inventario
                </div>
            </div>

            <!-- PARA USUARIOS NO ADMIN: se manda el valor SIN mostrarlo -->
            <input type="hidden"
                sec:authorize="!hasRole('ADMIN')"
                th:field="*{inventarioId}"/>

            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="fas fa-save me-2"></i>
                    <span th:text="${equipo.id != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Validación Bootstrap
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
